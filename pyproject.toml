[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mark_editor_tui"
version = "0.2.2"
description = "A terminal Markdown editor built with Textual"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "editor", "terminal", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "textual>=8.0",
    "markdown2html5-base>=0.6.1",
    "markdown2pdf-base>=0.6.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[project.scripts]
mark_editor_tui = "mark_editor_tui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mark_editor_tui = ["styles.tcss"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 88
extend-exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/test_editor.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"
